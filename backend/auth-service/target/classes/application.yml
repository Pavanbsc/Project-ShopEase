server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    # Add your MySQL credentials here or set DB_URL, DB_USERNAME, and DB_PASSWORD as environment variables.
    url: jdbc:mysql://localhost:3306/shopease_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root@39
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}